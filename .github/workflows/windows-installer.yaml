name: Build Windows CLI

on:
  workflow_call:
    inputs:
      app_version:
        description: "Version embedded in the installer name"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer version override (defaults to tag name or dev)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve installer version
        id: vars
        shell: pwsh
        run: |
          if ("${{ inputs.app_version }}") {
            $version = "${{ inputs.app_version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "dev"
          }
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -AppVersion "${{ steps.vars.outputs.app_version }}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-learning-windows-installer-${{ steps.vars.outputs.app_version }}
          path: |
            dist-installer/*.exe
            dist-installer/*.zip
          if-no-files-found: error
          overwrite: true
