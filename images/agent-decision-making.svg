<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Agentic decision making with durable and statistical autonomy</title>
  <desc id="description">An animated loop in which an agent chooses a bounded action, executes it, scores the outcome, and improves the policy. A task policy becomes autonomous through durable explicit user acceptance or complexity-proportional statistical evidence. Mandatory approval can block autonomy, rejection revokes acceptance, and only statistical autonomy samples drift audits.</desc>
  <style>
    .stage {
      opacity: 0.52;
      transform-box: fill-box;
      transform-origin: center;
    }
    .choose-stage { animation: choose-stage 8s ease-in-out infinite; }
    .execute-stage { animation: execute-stage 8s ease-in-out infinite; }
    .score-stage { animation: score-stage 8s ease-in-out infinite; }
    .improve-stage { animation: improve-stage 8s ease-in-out infinite; }
    .autonomy-stage { animation: autonomy-stage 8s ease-in-out infinite; }
    .flow {
      fill: none;
      stroke: #75d7ff;
      stroke-linecap: round;
      stroke-width: 4;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      opacity: 0;
    }
    .flow-one { animation: flow-one 8s ease-in-out infinite; }
    .flow-two { animation: flow-two 8s ease-in-out infinite; }
    .flow-three { animation: flow-three 8s ease-in-out infinite; }
    .choice-fill {
      transform-box: fill-box;
      transform-origin: left;
      animation: choice-fill 8s ease-in-out infinite;
    }
    .execution-line { animation: execution-line 8s ease-in-out infinite; }
    .metric-fill {
      transform-box: fill-box;
      transform-origin: left;
      animation: metric-fill 8s ease-in-out infinite;
    }
    .after-fill {
      transform-box: fill-box;
      transform-origin: left;
      animation: after-fill 8s ease-in-out infinite;
    }
    .gate-check { animation: gate-check 8s ease-in-out infinite; }
    .autonomous-mode { animation: autonomous-mode 8s ease-in-out infinite; }
    .feedback {
      fill: none;
      stroke: #7fba00;
      stroke-linecap: round;
      stroke-width: 4;
      stroke-dasharray: 920;
      stroke-dashoffset: 920;
      opacity: 0;
      animation: feedback 8s ease-in-out infinite;
    }
    .feedback-label { animation: feedback-label 8s ease-in-out infinite; }
    .feedback-arrow {
      opacity: 0;
      animation: feedback-arrow 8s step-end infinite;
    }

    @keyframes choose-stage {
      0%, 18% { opacity: 1; transform: translateY(-5px); }
      25%, 100% { opacity: 0.52; transform: translateY(0); }
    }
    @keyframes execute-stage {
      0%, 20% { opacity: 0.52; transform: translateY(0); }
      27%, 40% { opacity: 1; transform: translateY(-5px); }
      47%, 100% { opacity: 0.52; transform: translateY(0); }
    }
    @keyframes score-stage {
      0%, 42% { opacity: 0.52; transform: translateY(0); }
      49%, 62% { opacity: 1; transform: translateY(-5px); }
      69%, 100% { opacity: 0.52; transform: translateY(0); }
    }
    @keyframes improve-stage {
      0%, 64% { opacity: 0.52; transform: translateY(0); }
      71%, 86% { opacity: 1; transform: translateY(-5px); }
      94%, 100% { opacity: 0.52; transform: translateY(0); }
    }
    @keyframes autonomy-stage {
      0%, 78% { opacity: 0.52; transform: translateY(0); }
      85%, 96% { opacity: 1; transform: translateY(-4px); }
      100% { opacity: 0.52; transform: translateY(0); }
    }
    @keyframes flow-one {
      0%, 17% { opacity: 0; stroke-dashoffset: 50; }
      25%, 100% { opacity: 0.7; stroke-dashoffset: 0; }
    }
    @keyframes flow-two {
      0%, 39% { opacity: 0; stroke-dashoffset: 50; }
      47%, 100% { opacity: 0.7; stroke-dashoffset: 0; }
    }
    @keyframes flow-three {
      0%, 61% { opacity: 0; stroke-dashoffset: 50; }
      69%, 100% { opacity: 0.7; stroke-dashoffset: 0; }
    }
    @keyframes choice-fill {
      0% { transform: scaleX(0.2); }
      15%, 100% { transform: scaleX(1); }
    }
    @keyframes execution-line {
      0%, 24% { opacity: 0; }
      31%, 100% { opacity: 1; }
    }
    @keyframes metric-fill {
      0%, 46% { transform: scaleX(0.08); }
      59%, 100% { transform: scaleX(1); }
    }
    @keyframes after-fill {
      0%, 68% { transform: scaleX(0.78); }
      82%, 100% { transform: scaleX(1); }
    }
    @keyframes gate-check {
      0%, 82% { opacity: 0.22; }
      90%, 100% { opacity: 1; }
    }
    @keyframes autonomous-mode {
      0%, 87% { opacity: 0.25; }
      94%, 100% { opacity: 1; }
    }
    @keyframes feedback {
      0%, 92% { opacity: 0; stroke-dashoffset: 920; }
      98% { opacity: 0.9; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @keyframes feedback-label {
      0%, 92% { opacity: 0.28; }
      98% { opacity: 1; }
      100% { opacity: 0.28; }
    }
    @keyframes feedback-arrow {
      0%, 97.99% { opacity: 0; }
      98%, 99.99% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage, .flow, .choice-fill, .execution-line, .metric-fill, .after-fill, .autonomy-stage, .gate-check, .autonomous-mode, .feedback, .feedback-label, .feedback-arrow {
        animation: none;
      }
      .stage, .execution-line, .feedback-label { opacity: 1; }
      .flow, .feedback { opacity: 0.8; stroke-dashoffset: 0; }
      .feedback-arrow { opacity: 1; }
    }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#75d7ff"/>
    </marker>
    <marker id="feedback-arrowhead" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path class="feedback-arrow" d="M 0 0 L 14 7 L 0 14 Z" fill="#7fba00"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="8" fill="#18213a"/>
  <text x="45" y="38" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">AGENTIC DECISION MAKING</text>
  <text x="45" y="64" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="15">Explicit choices. Observable outcomes. Better decisions.</text>
  <text x="1155" y="45" fill="#75d7ff" font-family="Consolas, monospace" font-size="15" text-anchor="end">agent-learn</text>

  <line x1="290" y1="205" x2="330" y2="205" stroke="#506079" stroke-width="3"/>
  <line class="flow flow-one" x1="290" y1="205" x2="327" y2="205" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="205" x2="620" y2="205" stroke="#506079" stroke-width="3"/>
  <line class="flow flow-two" x1="580" y1="205" x2="617" y2="205" marker-end="url(#arrowhead)"/>
  <line x1="870" y1="205" x2="910" y2="205" stroke="#506079" stroke-width="3"/>
  <line class="flow flow-three" x1="870" y1="205" x2="907" y2="205" marker-end="url(#arrowhead)"/>

  <g class="stage choose-stage">
    <rect x="45" y="100" width="245" height="220" rx="8" fill="#10192c" stroke="#4cc2ff" stroke-width="2"/>
    <rect x="45" y="100" width="7" height="220" rx="3" fill="#4cc2ff"/>
    <text x="70" y="132" fill="#4cc2ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">01</text>
    <text x="100" y="133" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Choose</text>
    <text x="70" y="158" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="14">bounded executable actions</text>
    <text x="70" y="187" fill="#d8e2f1" font-family="Consolas, monospace" font-size="12">repository search</text>
    <rect x="70" y="200" width="175" height="22" rx="4" fill="#22314b"/>
    <rect class="choice-fill" x="70" y="200" width="60" height="22" rx="4" fill="#5d708f"/>
    <text x="78" y="215" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">text</text>
    <text x="258" y="215" fill="#aebbd2" font-family="Consolas, monospace" font-size="11" text-anchor="end">29%</text>
    <rect x="70" y="231" width="175" height="26" rx="4" fill="#18384f" stroke="#4cc2ff" stroke-width="1.5"/>
    <rect class="choice-fill" x="70" y="231" width="82" height="26" rx="4" fill="#0f6cbd"/>
    <text x="78" y="249" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">semantic</text>
    <text x="258" y="249" fill="#4cc2ff" font-family="Consolas, monospace" font-size="11" text-anchor="end">41%</text>
    <rect x="70" y="266" width="175" height="22" rx="4" fill="#22314b"/>
    <rect class="choice-fill" x="70" y="266" width="63" height="22" rx="4" fill="#5d708f"/>
    <text x="78" y="281" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">symbol</text>
    <text x="258" y="281" fill="#aebbd2" font-family="Consolas, monospace" font-size="11" text-anchor="end">30%</text>
    <text x="70" y="306" fill="#4cc2ff" font-family="Consolas, monospace" font-size="11">selected: semantic</text>
  </g>

  <g class="stage execute-stage">
    <rect x="335" y="100" width="245" height="220" rx="8" fill="#10192c" stroke="#7fba00" stroke-width="2"/>
    <rect x="335" y="100" width="7" height="220" rx="3" fill="#7fba00"/>
    <text x="360" y="132" fill="#7fba00" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">02</text>
    <text x="390" y="133" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Execute</text>
    <text x="360" y="158" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="14">run the selected strategy</text>
    <rect x="360" y="182" width="195" height="103" rx="6" fill="#0b1220" stroke="#31415c"/>
    <circle cx="374" cy="196" r="3" fill="#f25022"/>
    <circle cx="386" cy="196" r="3" fill="#ffb900"/>
    <circle cx="398" cy="196" r="3" fill="#7fba00"/>
    <text class="execution-line" x="372" y="222" fill="#75d7ff" font-family="Consolas, monospace" font-size="11">semantic_search(</text>
    <text class="execution-line" x="388" y="239" fill="#d8e2f1" font-family="Consolas, monospace" font-size="11">query, context</text>
    <text class="execution-line" x="372" y="256" fill="#75d7ff" font-family="Consolas, monospace" font-size="11">)</text>
    <text class="execution-line" x="372" y="274" fill="#7fba00" font-family="Consolas, monospace" font-size="11">completed in 182 ms</text>
    <text x="360" y="306" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="12">preserve context + result</text>
  </g>

  <g class="stage score-stage">
    <rect x="625" y="100" width="245" height="220" rx="8" fill="#10192c" stroke="#ffb900" stroke-width="2"/>
    <rect x="625" y="100" width="7" height="220" rx="3" fill="#ffb900"/>
    <text x="650" y="132" fill="#ffb900" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">03</text>
    <text x="680" y="133" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Score</text>
    <text x="650" y="158" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="14">measure the observed outcome</text>
    <text x="650" y="190" fill="#d8e2f1" font-family="Segoe UI, sans-serif" font-size="12">Intent</text>
    <rect x="718" y="179" width="112" height="13" rx="4" fill="#293750"/>
    <rect class="metric-fill" x="718" y="179" width="103" height="13" rx="4" fill="#4cc2ff"/>
    <text x="650" y="224" fill="#d8e2f1" font-family="Segoe UI, sans-serif" font-size="12">Adherence</text>
    <rect x="718" y="213" width="112" height="13" rx="4" fill="#293750"/>
    <rect class="metric-fill" x="718" y="213" width="99" height="13" rx="4" fill="#7fba00"/>
    <text x="650" y="258" fill="#d8e2f1" font-family="Segoe UI, sans-serif" font-size="12">Completion</text>
    <rect x="718" y="247" width="112" height="13" rx="4" fill="#293750"/>
    <rect class="metric-fill" x="718" y="247" width="106" height="13" rx="4" fill="#ffb900"/>
    <rect x="650" y="278" width="180" height="27" rx="5" fill="#3a3318"/>
    <text x="740" y="297" fill="#ffcf40" font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">reward = +0.84</text>
  </g>

  <g class="stage improve-stage">
    <rect x="915" y="100" width="240" height="220" rx="8" fill="#10192c" stroke="#f25022" stroke-width="2"/>
    <rect x="915" y="100" width="7" height="220" rx="3" fill="#f25022"/>
    <text x="940" y="132" fill="#f25022" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">04</text>
    <text x="970" y="133" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Improve</text>
    <text x="940" y="158" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="14">update the next decision</text>
    <text x="940" y="190" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="11">BEFORE</text>
    <rect x="940" y="200" width="170" height="18" rx="4" fill="#293750"/>
    <rect x="940" y="200" width="56" height="18" rx="4" fill="#5d708f"/>
    <text x="1125" y="214" fill="#aebbd2" font-family="Consolas, monospace" font-size="11" text-anchor="end">33%</text>
    <text x="940" y="244" fill="#f25022" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">AFTER</text>
    <rect x="940" y="254" width="170" height="22" rx="4" fill="#293750"/>
    <rect class="after-fill" x="940" y="254" width="70" height="22" rx="4" fill="#f25022"/>
    <text x="1125" y="270" fill="#ff8c69" font-family="Consolas, monospace" font-size="11" text-anchor="end">41%</text>
    <text x="940" y="299" fill="#d8e2f1" font-family="Consolas, monospace" font-size="11">policy v1  -&gt;  v2</text>
  </g>

  <line x1="1035" y1="320" x2="1035" y2="348" stroke="#506079" stroke-width="3"/>
  <path class="flow flow-three" d="M 1035 320 L 1035 340 L 1000 360" stroke="#75d7ff" marker-end="url(#arrowhead)"/>

  <g class="stage autonomy-stage">
    <rect x="45" y="350" width="1110" height="205" rx="8" fill="#10192c" stroke="#75d7ff" stroke-width="2"/>
    <rect x="45" y="350" width="7" height="205" rx="3" fill="#75d7ff"/>
    <text x="70" y="378" fill="#75d7ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">05</text>
    <text x="100" y="379" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Autonomy routes</text>
    <text x="300" y="379" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="12">same task policy · newest explicit feedback wins</text>

    <rect x="70" y="420" width="180" height="100" rx="6" fill="#202b40" stroke="#8aa0be"/>
    <text x="160" y="446" fill="#aebbd2" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SUPERVISED</text>
    <text x="160" y="470" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">ask once or observe</text>
    <text x="160" y="493" fill="#8aa0be" font-family="Consolas, monospace" font-size="10" text-anchor="middle">choose one route</text>

    <path d="M 250 470 L 270 470 L 270 444 L 290 444" fill="none" stroke="#75d7ff" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 250 470 L 270 470 L 270 506 L 290 506" fill="none" stroke="#75d7ff" stroke-width="2" marker-end="url(#arrowhead)"/>

    <g class="gate-check">
      <rect x="300" y="420" width="270" height="48" rx="6" fill="#173421" stroke="#7fba00" stroke-width="1.5"/>
      <text x="315" y="441" fill="#9bd43a" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">USER ACCEPTANCE</text>
      <text x="315" y="458" fill="#ffffff" font-family="Consolas, monospace" font-size="10">pin action · 0% audits · REJECT revokes</text>

      <rect x="300" y="482" width="270" height="48" rx="6" fill="#18384f" stroke="#4cc2ff" stroke-width="1.5"/>
      <text x="315" y="503" fill="#75d7ff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">STATISTICAL EVIDENCE</text>
      <text x="315" y="520" fill="#ffffff" font-family="Consolas, monospace" font-size="10">tier gates · proportional drift audits</text>
    </g>

    <path d="M 570 444 L 595 444 L 595 458 L 615 458" fill="none" stroke="#75d7ff" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 570 506 L 595 506 L 595 492 L 615 492" fill="none" stroke="#75d7ff" stroke-width="2" marker-end="url(#arrowhead)"/>

    <rect x="625" y="425" width="220" height="95" rx="6" fill="#2b2230" stroke="#ffb900" stroke-width="1.5"/>
    <text x="735" y="451" fill="#ffcf40" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AUTHORITY CHECK</text>
    <text x="735" y="476" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">mandatory approval blocks</text>
    <text x="735" y="499" fill="#d8e2f1" font-family="Consolas, monospace" font-size="10" text-anchor="middle">otherwise continue</text>

    <path d="M 845 472 L 895 472" stroke="#75d7ff" stroke-width="3" marker-end="url(#arrowhead)"/>
    <g class="autonomous-mode">
      <rect x="905" y="420" width="220" height="100" rx="6" fill="#173421" stroke="#7fba00" stroke-width="2"/>
      <text x="1015" y="445" fill="#9bd43a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AUTONOMOUS</text>
      <text x="1015" y="469" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">accepted action or winner</text>
      <text x="1015" y="491" fill="#d8e2f1" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">no routine ask</text>
      <text x="1015" y="510" fill="#9bd43a" font-family="Consolas, monospace" font-size="10" text-anchor="middle">observe every outcome</text>
    </g>
  </g>

  <text class="feedback-label" x="600" y="580" fill="#9bd43a" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">observable outcomes continue · audits apply only to statistical autonomy</text>
  <path class="feedback" d="M 1015 596 C 850 615, 350 615, 170 596" marker-end="url(#feedback-arrowhead)"/>
</svg>